[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qnap-photo-scanner"
version = "1.0.1"
description = "Organizza foto in struttura Anno/Mese su NAS QNAP, rilevando duplicati (MD5) e foto sfocate (varianza Laplaciano, Pillow+numpy)."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Giacomo Trinca Cintioli" }
]
keywords = ["qnap", "nas", "photo", "organization", "duplicates", "blur-detection"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Utilities",
]

[project.optional-dependencies]
dev = []

[project.scripts]
qnap-photo-scanner = "qnap_photo_scanner:main"

[tool.setuptools]
py-modules = ["qnap_photo_scanner"]
